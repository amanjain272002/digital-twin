name: Deploy Digital Twin

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SHOW GITHUB CONTEXT
      # ============================================================

      - name: Show GitHub context
        run: |
          echo "========================================"
          echo "       GITHUB ACTIONS CONTEXT"
          echo "========================================"

          echo "Repository:"
          echo "${{ github.repository }}"

          echo "Repository ID:"
          echo "${{ github.repository_id }}"

          echo "Repository Owner:"
          echo "${{ github.repository_owner }}"

          echo "Repository Owner ID:"
          echo "${{ github.repository_owner_id }}"

          echo "Ref:"
          echo "${{ github.ref }}"

          echo "Event:"
          echo "${{ github.event_name }}"

          echo "Environment:"
          echo "${{ github.event.inputs.environment || 'dev' }}"

          echo "========================================"

      # ============================================================
      # 3. CONFIGURE AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::241785578860:role/github-actions-twin-deploy
          role-session-name: github-actions-deploy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}
          audience: sts.amazonaws.com

      # ============================================================
      # 4. VERIFY AWS
      # ============================================================

      - name: Verify AWS identity
        run: |
          echo "========================================"
          echo "       AWS AUTHENTICATION SUCCESS"
          echo "========================================"

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""
          echo "========================================"

      # ============================================================
      # 5. PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 6. UV
      # ============================================================

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 7. TERRAFORM
      # ============================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ============================================================
      # 8. NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ============================================================
      # 9. VERIFY TOOLING
      # ============================================================

      - name: Verify tooling
        run: |
          echo "========================================"
          echo "         TOOL VERSIONS"
          echo "========================================"

          python --version
          node --version
          npm --version
          terraform version
          aws --version
          uv --version

          echo "========================================"

      # ============================================================
      # 10. DEPLOY
      # ============================================================

      - name: Run deployment script
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DEFAULT_AWS_REGION: ${{ secrets.DEFAULT_AWS_REGION }}
        run: |
          set -e

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"

          echo "========================================"
          echo "       STARTING DEPLOYMENT"
          echo "========================================"

          CURRENT_ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "AWS Account : $CURRENT_ACCOUNT"
          echo "Expected    : $AWS_ACCOUNT_ID"
          echo "AWS Region  : $DEFAULT_AWS_REGION"
          echo "Environment : $ENVIRONMENT"

          if [ "$CURRENT_ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo "ERROR: AWS account mismatch."
            exit 1
          fi

          chmod +x scripts/deploy.sh

          ./scripts/deploy.sh "$ENVIRONMENT"

      # ============================================================
      # 11. GET TERRAFORM OUTPUTS
      # ============================================================

      - name: Get deployment outputs
        id: deploy_outputs
        working-directory: ./terraform
        env:
          DEFAULT_AWS_REGION: ${{ secrets.DEFAULT_AWS_REGION }}
        run: |
          set -e

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"

          echo "Selecting workspace: $ENVIRONMENT"

          terraform workspace select "$ENVIRONMENT"

          API_URL=$(terraform output -raw api_gateway_url 2>/dev/null || true)
          FRONTEND_BUCKET=$(terraform output -raw s3_frontend_bucket 2>/dev/null || true)
          FRONTEND_URL=$(terraform output -raw frontend_url 2>/dev/null || true)
          CHAT_URL=$(terraform output -raw chat_url 2>/dev/null || true)
          HEALTH_URL=$(terraform output -raw health_url 2>/dev/null || true)
          LAMBDA_FUNCTION=$(terraform output -raw lambda_function_name 2>/dev/null || true)
          AWS_REGION_OUTPUT=$(terraform output -raw aws_region 2>/dev/null || true)
          BEDROCK_MODEL=$(terraform output -raw bedrock_model_id 2>/dev/null || true)

          [ -z "$API_URL" ] && API_URL="Not available"
          [ -z "$FRONTEND_BUCKET" ] && FRONTEND_BUCKET="Not available"
          [ -z "$FRONTEND_URL" ] && FRONTEND_URL="Not available"
          [ -z "$CHAT_URL" ] && CHAT_URL="Not available"
          [ -z "$HEALTH_URL" ] && HEALTH_URL="Not available"
          [ -z "$LAMBDA_FUNCTION" ] && LAMBDA_FUNCTION="Not available"
          [ -z "$AWS_REGION_OUTPUT" ] && AWS_REGION_OUTPUT="$DEFAULT_AWS_REGION"
          [ -z "$BEDROCK_MODEL" ] && BEDROCK_MODEL="Not available"

          {
            echo "api_url=$API_URL"
            echo "frontend_bucket=$FRONTEND_BUCKET"
            echo "frontend_url=$FRONTEND_URL"
            echo "chat_url=$CHAT_URL"
            echo "health_url=$HEALTH_URL"
            echo "lambda_function=$LAMBDA_FUNCTION"
            echo "aws_region=$AWS_REGION_OUTPUT"
            echo "bedrock_model=$BEDROCK_MODEL"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo "       DEPLOYMENT OUTPUTS"
          echo "========================================"

          echo "API Gateway      : $API_URL"
          echo "Frontend URL     : $FRONTEND_URL"
          echo "Frontend Bucket  : $FRONTEND_BUCKET"
          echo "Chat URL         : $CHAT_URL"
          echo "Health URL       : $HEALTH_URL"
          echo "Lambda           : $LAMBDA_FUNCTION"
          echo "Bedrock Model    : $BEDROCK_MODEL"
          echo "AWS Region       : $AWS_REGION_OUTPUT"

      # ============================================================
      # 12. HEALTH CHECK
      # ============================================================

      - name: Test API health
        if: steps.deploy_outputs.outputs.health_url != 'Not available'
        run: |
          HEALTH_URL="${{ steps.deploy_outputs.outputs.health_url }}"

          echo "Testing:"
          echo "$HEALTH_URL"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/health-response.json \
            --write-out "%{http_code}" \
            "$HEALTH_URL" || true)

          echo ""
          echo "HTTP Status: $HTTP_STATUS"

          echo ""
          echo "Response:"
          cat /tmp/health-response.json || true

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Health check passed."
          else
            echo "WARNING: Health endpoint returned HTTP $HTTP_STATUS."
          fi

      # ============================================================
      # 13. FINAL SUMMARY
      # ============================================================

      - name: Deployment Summary
        run: |
          echo ""
          echo "========================================"
          echo "       DEPLOYMENT COMPLETE"
          echo "========================================"

          echo ""
          echo "Environment:"
          echo "${{ github.event.inputs.environment || 'dev' }}"

          echo ""
          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "AWS Account:"
          echo "${{ secrets.AWS_ACCOUNT_ID }}"

          echo ""
          echo "AWS Region:"
          echo "${{ steps.deploy_outputs.outputs.aws_region }}"

          echo ""
          echo "Frontend URL:"
          echo "${{ steps.deploy_outputs.outputs.frontend_url }}"

          echo ""
          echo "Frontend S3:"
          echo "${{ steps.deploy_outputs.outputs.frontend_bucket }}"

          echo ""
          echo "API Gateway:"
          echo "${{ steps.deploy_outputs.outputs.api_url }}"

          echo ""
          echo "Chat URL:"
          echo "${{ steps.deploy_outputs.outputs.chat_url }}"

          echo ""
          echo "Health URL:"
          echo "${{ steps.deploy_outputs.outputs.health_url }}"

          echo ""
          echo "Lambda:"
          echo "${{ steps.deploy_outputs.outputs.lambda_function }}"

          echo ""
          echo "Bedrock Model:"
          echo "${{ steps.deploy_outputs.outputs.bedrock_model }}"

          echo ""
          echo "========================================"
          echo "           SUCCESS"
          echo "========================================"
